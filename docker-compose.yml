services:
  redis:
    image: redis
    ports:
      - "6380:6379"

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=scheduler
      - POSTGRES_PASSWORD=scheduler
      - POSTGRES_DB=scheduler_db
    ports:
      - "5432:5432"

  leader1:
    build:
      context: .
      dockerfile: Dockerfile.leader
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis

  leader2:
    build:
      context: .
      dockerfile: Dockerfile.leader
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis

  worker1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - postgres

  worker2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - postgres

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile.watchdog
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - PYTHONUNBUFFERED=1
    ports:
      - "8500:8500"
    depends_on:
      - redis
      - postgres